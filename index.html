<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Command Center</title>
<style>
  /* ── Dunkles Command-Center-Theme (bewusst nur ein Modus) ───────── */
  :root {
    color-scheme: dark;
    --page:    #0a0a0a;
    --card:    #141414;
    --card-2:  #171717;
    --border:  #262626;
    --ink:     #f2f2f2;
    --ink-2:   #a3a3a3;
    --muted:   #7a7a7a;
    --grid:    #1f1f1f;
    --green:   #34d178;   /* Akzent: Gewinne, Live, Wertverlauf */
    --green-dim: rgba(52, 209, 120, 0.14);
    --red:     #f26d6d;
    --blue:    #56aaf7;   /* Aktien */
    --purple:  #b3a5f5;   /* ETF   */
    --amber:   #f0b429;
    --gray-seg:#6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
    padding: 40px 24px 64px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  .eyebrow {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
  .statusline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    font-size: 12px; color: var(--ink-2); margin-bottom: 26px; }
  .statusline .sep { color: var(--muted); }
  .livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; }
  .live .livedot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .live #liveLabel { color: var(--green); }

  .btn {
    display: inline-block; font-size: 13px; color: var(--ink);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; cursor: pointer; margin-bottom: 28px;
  }
  .btn:hover { background: var(--card-2); }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* Kennzahlen-Kacheln */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 40px; }
  @media (max-width: 820px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .tile .lbl { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .tile .val { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  .tile .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tile .sub.up { color: var(--green); }
  .tile .sub.down { color: var(--red); }

  /* Abschnitts-Köpfe */
  .sechead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px;
    border-bottom: 1px solid var(--border); padding-bottom: 9px; margin: 44px 0 18px; }
  .sechead .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .sechead h2 { font-size: 14px; font-weight: 650; display: inline; }
  .sechead .right { margin-left: auto; font-size: 12px; color: var(--ink-2); }
  .sechead .right b { color: var(--ink); font-weight: 650; }
  .sechead .right .pct-up { color: var(--green); }

  /* Wertverlauf */
  .ranges { display: flex; gap: 6px; margin-bottom: 12px; }
  .chip { font-size: 11px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 9px; }
  .chip.on { background: var(--green); color: #06130b; border-color: var(--green); font-weight: 650; }
  .chartwrap { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Positions-Karten + Balken */
  .classgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; align-items: start; }
  @media (max-width: 820px) { .classgrid { grid-template-columns: 1fr; } }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    border-left: 3px solid var(--border); padding: 12px 14px;
  }
  .pcard .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .pcard .tick { font-size: 13px; font-weight: 700; }
  .pcard .share { font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .pcard .val { font-size: 19px; font-weight: 650; margin: 7px 0 3px; font-variant-numeric: tabular-nums; }
  .pcard .chg { font-size: 11.5px; font-weight: 600; }
  .pcard .chg.up { color: var(--green); } .pcard .chg.down { color: var(--red); }
  .pcard .meta { font-size: 10.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

  .note { font-size: 12px; color: var(--muted); margin-top: 14px; }
  footer { font-size: 11.5px; color: var(--muted); margin-top: 52px; line-height: 1.7;
    border-top: 1px solid var(--border); padding-top: 16px; }

  #tooltip {
    position: absolute; pointer-events: none; z-index: 5; display: none;
    background: #1c1c1c; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    padding: 8px 11px; font-size: 12.5px; min-width: 150px; color: var(--ink);
  }
  #tooltip .tt-title { color: var(--muted); margin-bottom: 4px; }
  #tooltip .tt-row { display: flex; align-items: center; gap: 7px; padding: 1.5px 0; }
  #tooltip .tt-key { width: 14px; height: 0; border-top: 3px solid; border-radius: 2px; flex: none; }
  #tooltip .tt-name { color: var(--ink-2); }
  #tooltip .tt-val { font-weight: 650; font-variant-numeric: tabular-nums; margin-left: auto; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Persönliches Finanz-Dashboard / Vermögen</div>
  <h1>Portfolio Command Center</h1>
  <div class="statusline" id="statusline">
    <span><span class="livedot"></span><span id="liveLabel">Snapshot</span></span>
    <span class="sep">·</span><span id="stampTickers"></span>
    <span class="sep">·</span><span>Kurse: <span id="stampPrices"></span></span>
    <span class="sep">·</span><span id="stampDate"></span>
  </div>

  <button class="btn" id="refreshBtn" type="button">⟳ Kurse aktualisieren</button>

  <div class="tiles">
    <div class="tile">
      <div class="lbl">Gesamtwert</div>
      <div class="val" id="tTotal">–</div>
      <div class="sub">USD</div>
    </div>
    <div class="tile">
      <div class="lbl">Heute</div>
      <div class="val" id="tDayAbs">–</div>
      <div class="sub" id="tDaySub">vs. Vortag</div>
    </div>
    <div class="tile">
      <div class="lbl">12 Monate</div>
      <div class="val" id="tYearAbs">–</div>
      <div class="sub" id="tYearSub"></div>
    </div>
    <div class="tile">
      <div class="lbl">Positionen</div>
      <div class="val" id="tCount">–</div>
      <div class="sub" id="tCountSub"></div>
    </div>
  </div>

  <div class="sechead">
    <h2>Portfolio-Wert</h2>
    <span class="right" id="lineSub">Letzte 12 Monate · Alpha Vantage</span>
  </div>
  <div class="ranges" aria-hidden="true">
    <span class="chip">1W</span><span class="chip">1M</span><span class="chip">3M</span>
    <span class="chip">6M</span><span class="chip on">1J</span>
  </div>
  <div class="chartwrap" id="lineWrap"></div>
  <div class="note" id="lineNote"></div>

  <div class="sechead">
    <h2>Portfolio-Zusammensetzung</h2>
    <span class="right">Verteilung nach Position</span>
  </div>
  <div class="chartwrap" id="donutWrap" style="max-width: 560px; margin: 0 auto;"></div>

  <div id="classSections"></div>

  <footer id="foot"></footer>
</div>

<div id="tooltip" role="status"></div>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════
   KONFIGURATION — hier darfst du gefahrlos ändern:
   - positions: deine Positionen (symbol, name, shares = Stückzahl,
     cls = Anlageklasse für die Gruppierung)
   - apiKey: optional ein eigener (kostenloser) Alpha-Vantage-Key von
     https://www.alphavantage.co/support/#api-key — nur mit Key UND
     Internet holt die Seite live neue Kurse (Button + Intervall).
   - refreshSeconds: Intervall im Live-Modus. Achtung: Der Gratis-Key
     erlaubt 25 Anfragen/TAG; bei 4 Positionen ist Minutentakt nach
     ~6 Minuten am Limit. Realistisch: 3600.
   Die eingebetteten Kurse unten (SNAPSHOT) wurden über den
   Alpha-Vantage-MCP-Connector geholt; ein MCP-Connector ist aus einer
   Browser-Datei nicht erreichbar, darum nutzt der Live-Modus die
   normale Alpha-Vantage-Web-API.
   ════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  positions: [
    { symbol: "AAPL", name: "Apple Inc.",           shares: 6,  cls: "Aktien" },
    { symbol: "MSFT", name: "Microsoft Corp.",      shares: 4,  cls: "Aktien" },
    { symbol: "SAP",  name: "SAP SE (ADR)",         shares: 10, cls: "Aktien" },
    { symbol: "VOO",  name: "Vanguard S&P 500 ETF", shares: 3,  cls: "ETF"    },
  ],
  apiKey: "",
  refreshSeconds: 60,
};

const SNAPSHOT = {
  asOf: "12.08.2026 · US-Börsenschluss",
  currency: "USD",
  quotes: {
    AAPL: { price: 302.25, prevClose: 304.91 },
    MSFT: { price: 492.43, prevClose: 503.81 },
    SAP:  { price: 204.15, prevClose: 209.68 },
    VOO:  { price: 710.17, prevClose: 708.42 },
  },
  months: ["2025-08","2025-09","2025-10","2025-11","2025-12","2026-01",
           "2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08"],
  /* Monats-Schlusskurse (dividendenbereinigt). VOO: null = Historie war
     wegen des API-Tageslimits nicht mehr abrufbar; Live-Modus lädt nach. */
  history: {
    AAPL: [231.28, 253.69, 269.37, 278.09, 271.12, 258.77, 263.71, 253.33, 270.86, 311.79, 289.11, 308.64, 302.25],
    MSFT: [503.48, 514.67, 514.53, 489.83, 481.47, 428.38, 391.89, 369.37, 406.90, 450.24, 373.02, 464.72, 492.43],
    SAP:  [267.61, 262.75, 255.67, 237.71, 238.85, 197.68, 198.16, 168.35, 166.66, 181.79, 154.11, 183.62, 204.15],
    VOO:  null,
  },
};

const state = {
  quotes: JSON.parse(JSON.stringify(SNAPSHOT.quotes)),
  history: JSON.parse(JSON.stringify(SNAPSHOT.history)),
  live: false,
  lastUpdate: null,
};

/* Anlageklassen-Farben wie im Vorbild: Aktien blau, ETF violett */
const CLASS_COLOR = { "Aktien": "--blue", "ETF": "--purple", "Krypto": "--purple", "Rohstoffe": "--amber", "Cash": "--gray-seg" };
/* Donut-Segmentfarben je Position: Klassenfarbe in Helligkeitsstufen */
const SEG_SHADES = {
  "--blue":   ["#56aaf7", "#3186d6", "#7fc0fa", "#1f66ab"],
  "--purple": ["#b3a5f5", "#8f7ce8", "#cfc6f9", "#6f5cd0"],
  "--amber":  ["#f0b429", "#c98f14", "#f7cd66", "#a37310"],
  "--gray-seg": ["#6b6b6b", "#8a8a8a", "#4f4f4f", "#a8a8a8"],
};

const fmtC  = new Intl.NumberFormat("de-DE", { style: "currency", currency: SNAPSHOT.currency, maximumFractionDigits: 2 });
const fmt0  = new Intl.NumberFormat("de-DE", { style: "currency", currency: SNAPSHOT.currency, maximumFractionDigits: 0 });
const fmtP  = new Intl.NumberFormat("de-DE", { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1 });
const css   = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el    = (t, a = {}) => { const n = document.createElementNS("http://www.w3.org/2000/svg", t); for (const k in a) n.setAttribute(k, a[k]); return n; };
const MONTH_DE = { "01":"Jan","02":"Feb","03":"Mär","04":"Apr","05":"Mai","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Okt","11":"Nov","12":"Dez" };
const monthLabel = (m) => MONTH_DE[m.slice(5)] + " " + m.slice(2, 4);
const sign = (v, s) => (v >= 0 ? "+" : "−") + s;

function positionValues() {
  const classCount = {};
  return CONFIG.positions.map((p, i) => {
    const q = state.quotes[p.symbol];
    const shadeIdx = classCount[p.cls] = (classCount[p.cls] ?? -1) + 1;
    const clsVar = CLASS_COLOR[p.cls] || "--gray-seg";
    return {
      ...p, i,
      price: q.price,
      value: q.price * p.shares,
      prevValue: q.prevClose * p.shares,
      changePct: (q.price - q.prevClose) / q.prevClose,
      clsColor: css(clsVar),
      segColor: SEG_SHADES[clsVar][shadeIdx % 4],
      yearPct: state.history[p.symbol]
        ? (state.history[p.symbol].at(-1) - state.history[p.symbol][0]) / state.history[p.symbol][0]
        : null,
    };
  });
}

/* ── Kopf & Kacheln ────────────────────────────────────────────────── */
function renderHead() {
  const pos = positionValues();
  const total = pos.reduce((s, p) => s + p.value, 0);
  const prev  = pos.reduce((s, p) => s + p.prevValue, 0);
  const d = total - prev;

  document.getElementById("statusline").classList.toggle("live", state.live);
  document.getElementById("liveLabel").textContent = state.live ? "Live" : "Snapshot";
  document.getElementById("stampTickers").textContent = pos.length + "/" + pos.length + " Positionen";
  document.getElementById("stampPrices").textContent = state.live && state.lastUpdate
    ? "vor " + Math.max(0, Math.round((Date.now() - state.lastUpdate) / 60000)) + " Min."
    : "Snapshot";
  document.getElementById("stampDate").textContent = SNAPSHOT.asOf;

  document.getElementById("tTotal").textContent = fmtC.format(total);
  const dayAbs = document.getElementById("tDayAbs");
  dayAbs.textContent = sign(d, fmt0.format(Math.abs(d)));
  const daySub = document.getElementById("tDaySub");
  daySub.className = "sub " + (d >= 0 ? "up" : "down");
  daySub.textContent = sign(d / prev, fmtP.format(Math.abs(d / prev))) + " vs. Vortag";

  const withHist = pos.filter(p => state.history[p.symbol]);
  const first = withHist.reduce((s, p) => s + p.shares * state.history[p.symbol][0], 0);
  const last  = withHist.reduce((s, p) => s + p.shares * state.history[p.symbol].at(-1), 0);
  const yd = last - first;
  document.getElementById("tYearAbs").textContent = sign(yd, fmt0.format(Math.abs(yd)));
  const ySub = document.getElementById("tYearSub");
  ySub.className = "sub " + (yd >= 0 ? "up" : "down");
  ySub.textContent = sign(yd / first, fmtP.format(Math.abs(yd / first)))
    + (withHist.length < pos.length ? " · ohne VOO" : "");

  document.getElementById("tCount").textContent = String(pos.length);
  const classes = [...new Set(pos.map(p => p.cls))];
  document.getElementById("tCountSub").textContent = classes.map(c =>
    pos.filter(p => p.cls === c).length + "× " + c).join(" · ");
}

/* ── Wertverlauf (grüne Fläche wie im Vorbild) ─────────────────────── */
function renderLine() {
  const wrap = document.getElementById("lineWrap");
  const months = SNAPSHOT.months;
  const included = CONFIG.positions.filter(p => state.history[p.symbol]);
  const totals = months.map((_, mi) => included.reduce((s, p) => s + p.shares * state.history[p.symbol][mi], 0));

  const W = 920, H = 300, m = { l: 10, r: 74, t: 14, b: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const lo = Math.min(...totals), hi = Math.max(...totals);
  const step = niceStep((hi - lo) / 4);
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const X = (i) => m.l + iw * (i / (months.length - 1));
  const Y = (v) => m.t + ih * (1 - (v - y0) / (y1 - y0));

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", tabindex: "0",
    "aria-label": "Liniendiagramm: Portfolio-Wert der letzten 12 Monate" });

  for (let v = y0; v <= y1 + 1; v += step) {
    svg.append(el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: css("--grid"), "stroke-width": "1" }));
    const t = el("text", { x: W - m.r + 8, y: Y(v), "dominant-baseline": "middle", "font-size": "11", fill: css("--muted") });
    t.textContent = v.toLocaleString("de-DE") + " $";
    svg.append(t);
  }
  months.forEach((mo, i) => {
    if (i % 2 !== 0) return;
    const t = el("text", { x: X(i), y: H - 8, "text-anchor": i === 0 ? "start" : "middle", "font-size": "11", fill: css("--muted") });
    t.textContent = monthLabel(mo);
    svg.append(t);
  });

  const pts = totals.map((v, i) => `${X(i)},${Y(v)}`).join(" ");
  svg.append(el("polygon", { points: `${m.l},${Y(y0)} ${pts} ${W - m.r},${Y(y0)}`, fill: css("--green"), opacity: "0.12" }));
  svg.append(el("polyline", { points: pts, fill: "none", stroke: css("--green"), "stroke-width": "2",
    "stroke-linejoin": "round", "stroke-linecap": "round" }));

  const li = totals.length - 1;
  svg.append(el("circle", { cx: X(li), cy: Y(totals[li]), r: "4.5", fill: css("--green"), stroke: css("--page"), "stroke-width": "2" }));

  const vline = el("line", { y1: m.t, y2: H - m.b, stroke: css("--border"), "stroke-width": "1", visibility: "hidden" });
  const fdot  = el("circle", { r: "4.5", fill: css("--green"), stroke: css("--page"), "stroke-width": "2", visibility: "hidden" });
  svg.append(vline, fdot);

  let idx = -1;
  const showIdx = (i, ev) => {
    idx = i;
    vline.setAttribute("x1", X(i)); vline.setAttribute("x2", X(i)); vline.setAttribute("visibility", "visible");
    fdot.setAttribute("cx", X(i)); fdot.setAttribute("cy", Y(totals[i])); fdot.setAttribute("visibility", "visible");
    const rows = [[css("--green"), "Gesamt", fmt0.format(totals[i])]];
    for (const p of included) rows.push([p.segColor, p.symbol, fmt0.format(p.shares * state.history[p.symbol][i])]);
    tooltipShow(ev, monthLabel(SNAPSHOT.months[i]), rows, wrap, X(i) / W);
  };
  const hit = el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" });
  hit.addEventListener("pointermove", (ev) => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(months.length - 1, Math.round((px - m.l) / iw * (months.length - 1))));
    showIdx(i, ev);
  });
  hit.addEventListener("pointerleave", () => { vline.setAttribute("visibility", "hidden"); fdot.setAttribute("visibility", "hidden"); tooltipHide(); });
  svg.addEventListener("keydown", (ev) => {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    const i = idx < 0 ? months.length - 1 : Math.max(0, Math.min(months.length - 1, idx + (ev.key === "ArrowRight" ? 1 : -1)));
    showIdx(i, { clientX: null });
  });
  svg.append(hit);

  wrap.textContent = ""; wrap.append(svg);

  const missing = CONFIG.positions.filter(p => !state.history[p.symbol]).map(p => p.symbol);
  document.getElementById("lineSub").textContent = "Letzte 12 Monate · Alpha Vantage" + (missing.length ? " · ohne " + missing.join(", ") : "");
  document.getElementById("lineNote").textContent = missing.length
    ? "Für " + missing.join(", ") + " ließ sich die 12-Monats-Historie nicht laden (Tageslimit der kostenlosen Alpha-Vantage-API). Der Verlauf zeigt die übrigen Positionen; im Live-Modus wird sie nachgeladen."
    : "";
}
function niceStep(raw) {
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const k of [1, 2, 2.5, 5, 10]) if (raw <= k * mag) return k * mag;
  return 10 * mag;
}

/* ── Donut: dicker Ring, Gesamtwert in der Mitte, Labels außen ─────── */
function donutArc(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  return `M${x0} ${y0} A${r1} ${r1} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 ${large} 0 ${x3} ${y3} Z`;
}
function renderDonut() {
  const pos = positionValues();
  const total = pos.reduce((s, p) => s + p.value, 0);
  const W = 560, H = 320, cx = W / 2, cy = 158, r1 = 118, r0 = 78;
  const gap = 2 / r1;

  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Donut-Diagramm: Verteilung der Portfolio-Positionen" });
  let a = -Math.PI / 2;

  for (const p of pos) {
    const frac = p.value / total, a0 = a + gap / 2, a1 = a + frac * 2 * Math.PI - gap / 2;
    const path = el("path", { d: donutArc(cx, cy, r0, r1, a0, a1), fill: p.segColor, tabindex: "0" });
    const mid = (a0 + a1) / 2;
    const lx = cx + (r1 + 18) * Math.cos(mid), ly = cy + (r1 + 18) * Math.sin(mid);
    const anchor = Math.cos(mid) > 0.35 ? "start" : (Math.cos(mid) < -0.35 ? "end" : "middle");
    const t1 = el("text", { x: lx, y: ly - 6, "text-anchor": anchor, "font-size": "12", "font-weight": "650", fill: css("--ink") });
    t1.textContent = p.symbol;
    const t2 = el("text", { x: lx, y: ly + 9, "text-anchor": anchor, "font-size": "11", fill: css("--ink-2") });
    t2.textContent = fmtP.format(frac);

    const show = (ev) => {
      svg.querySelectorAll("path").forEach(q => q.style.opacity = "0.45");
      path.style.opacity = "1";
      tooltipShow(ev, p.symbol + " · " + p.name, [[p.segColor, p.cls, fmtC.format(p.value) + " · " + fmtP.format(frac)]]);
    };
    const hide = () => { svg.querySelectorAll("path").forEach(q => q.style.opacity = "1"); tooltipHide(); };
    path.addEventListener("pointermove", show);
    path.addEventListener("pointerleave", hide);
    path.addEventListener("focus", () => show({ clientX: null }));
    path.addEventListener("blur", hide);

    svg.append(path, t1, t2);
    a += frac * 2 * Math.PI;
  }
  const c1 = el("text", { x: cx, y: cy - 6, "text-anchor": "middle", "font-size": "24", "font-weight": "700", fill: css("--ink") });
  c1.textContent = fmt0.format(total);
  const c2 = el("text", { x: cx, y: cy + 16, "text-anchor": "middle", "font-size": "10", "letter-spacing": "2", fill: css("--muted") });
  c2.textContent = "GESAMT · USD";
  svg.append(c1, c2);

  const wrap = document.getElementById("donutWrap");
  wrap.textContent = ""; wrap.append(svg);
}

/* ── Anlageklassen: Karten links, Balken rechts ────────────────────── */
function renderClasses() {
  const pos = positionValues();
  const total = pos.reduce((s, p) => s + p.value, 0);
  const root = document.getElementById("classSections");
  root.textContent = "";

  for (const cls of [...new Set(pos.map(p => p.cls))]) {
    const list = pos.filter(p => p.cls === cls).sort((a, b) => b.value - a.value);
    const clsSum = list.reduce((s, p) => s + p.value, 0);
    const clsPrev = list.reduce((s, p) => s + p.prevValue, 0);
    const color = list[0].clsColor;

    const head = document.createElement("div"); head.className = "sechead";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = color;
    const h2 = document.createElement("h2"); h2.textContent = cls;
    const right = document.createElement("span"); right.className = "right";
    const b = document.createElement("b"); b.textContent = fmt0.format(clsSum);
    right.append(b, document.createTextNode("  " + fmtP.format(clsSum / total) + " des Portfolios  "));
    const dp = document.createElement("span");
    const dPct = (clsSum - clsPrev) / clsPrev;
    dp.className = dPct >= 0 ? "pct-up" : "";
    dp.style.color = dPct >= 0 ? css("--green") : css("--red");
    dp.textContent = sign(dPct, fmtP.format(Math.abs(dPct)));
    right.append(dp);
    head.append(dot, h2, right);
    root.append(head);

    const grid = document.createElement("div"); grid.className = "classgrid";
    const cards = document.createElement("div"); cards.className = "cards";
    for (const p of list) {
      const c = document.createElement("div"); c.className = "pcard";
      c.style.borderLeftColor = p.segColor;
      const r1 = document.createElement("div"); r1.className = "row1";
      const tk = document.createElement("span"); tk.className = "tick"; tk.textContent = p.symbol;
      const sh = document.createElement("span"); sh.className = "share";
      sh.textContent = fmtP.format(p.value / clsSum) + " der Klasse";
      r1.append(tk, sh);
      const v = document.createElement("div"); v.className = "val"; v.textContent = fmt0.format(p.value);
      const ch = document.createElement("div"); ch.className = "chg " + (p.changePct >= 0 ? "up" : "down");
      ch.textContent = sign(p.changePct, fmtP.format(Math.abs(p.changePct))) + " heute";
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = p.shares + " Stk. × " + fmtC.format(p.price);
      c.append(r1, v, ch, meta);
      cards.append(c);
    }

    const barW = 420, rowH = 30, padT = 6;
    const H = list.length * rowH + padT * 2;
    const svg = el("svg", { viewBox: `0 0 ${barW} ${H}`, role: "img", "aria-label": "Balken: Verteilung innerhalb " + cls });
    const maxV = Math.max(...list.map(p => p.value));
    list.forEach((p, ri) => {
      const y = padT + ri * rowH;
      const t = el("text", { x: 0, y: y + rowH / 2, "dominant-baseline": "middle", "font-size": "11.5", "font-weight": "600", fill: css("--ink-2") });
      t.textContent = p.symbol;
      const bw = Math.max(3, (p.value / maxV) * (barW - 190));
      const rect = el("rect", { x: 52, y: y + rowH / 2 - 8, width: bw, height: 16, rx: 2, fill: p.segColor });
      const vl = el("text", { x: 52 + bw + 8, y: y + rowH / 2, "dominant-baseline": "middle", "font-size": "10.5", fill: css("--muted") });
      vl.textContent = fmt0.format(p.value) + " · " + fmtP.format(p.value / clsSum);
      const show = (ev) => tooltipShow(ev, p.symbol + " · " + p.name, [[p.segColor, p.cls, fmtC.format(p.value)]]);
      rect.addEventListener("pointermove", show);
      rect.addEventListener("pointerleave", tooltipHide);
      svg.append(t, rect, vl);
    });
    const barwrap = document.createElement("div"); barwrap.className = "chartwrap"; barwrap.append(svg);
    grid.append(cards, barwrap);
    root.append(grid);
  }
}

/* ── Tooltip (textContent, nie innerHTML) ──────────────────────────── */
function tooltipShow(ev, title, rows, anchorWrap, xFrac) {
  const tt = document.getElementById("tooltip");
  tt.textContent = "";
  const h = document.createElement("div"); h.className = "tt-title"; h.textContent = title;
  tt.append(h);
  for (const [color, name, val] of rows) {
    const r = document.createElement("div"); r.className = "tt-row";
    const k = document.createElement("span"); k.className = "tt-key"; k.style.borderTopColor = color;
    const n = document.createElement("span"); n.className = "tt-name"; n.textContent = name;
    const v = document.createElement("span"); v.className = "tt-val"; v.textContent = val;
    r.append(k, n, v); tt.append(r);
  }
  tt.style.display = "block";
  const pad = 14;
  if (ev && ev.clientX !== null && ev.clientX !== undefined) {
    const x = ev.clientX + window.scrollX, y = (ev.clientY || 0) + window.scrollY;
    const flip = ev.clientX > window.innerWidth - 220;
    tt.style.left = (flip ? x - tt.offsetWidth - pad : x + pad) + "px";
    tt.style.top = (y - 12) + "px";
  } else if (anchorWrap) {
    const r = anchorWrap.getBoundingClientRect();
    tt.style.left = (r.left + window.scrollX + (xFrac || 0.5) * r.width + pad) + "px";
    tt.style.top = (r.top + window.scrollY + 40) + "px";
  } else {
    tt.style.left = (window.scrollX + window.innerWidth / 2 - 80) + "px";
    tt.style.top = (window.scrollY + 200) + "px";
  }
}
function tooltipHide() { document.getElementById("tooltip").style.display = "none"; }

function renderFoot() {
  document.getElementById("foot").textContent =
    "Datenquelle: Alpha Vantage (Kurse in USD, ggf. 15 Min. verzögert) · Datenstand: " + SNAPSHOT.asOf + ". " +
    "Diese Seite läuft komplett ohne Server; die eingebetteten Kurse wurden über den Alpha-Vantage-MCP-Connector geholt. " +
    "Für Live-Aktualisierung eigenen API-Key in CONFIG.apiKey eintragen (Gratis-Key: max. 25 Abrufe/Tag). Keine Anlageberatung.";
}

function renderAll() { renderHead(); renderLine(); renderDonut(); renderClasses(); renderFoot(); }

/* ── Live-Modus ────────────────────────────────────────────────────── */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function avFetch(params) {
  const u = new URL("https://www.alphavantage.co/query");
  for (const k in params) u.searchParams.set(k, params[k]);
  u.searchParams.set("apikey", CONFIG.apiKey);
  const res = await fetch(u); if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  if (j.Note || j.Information || j["Error Message"]) throw new Error("API-Limit oder Fehler");
  return j;
}
async function refreshQuotes() {
  document.body.style.opacity = "0.75";
  try {
    for (const p of CONFIG.positions) {
      const j = await avFetch({ function: "GLOBAL_QUOTE", symbol: p.symbol });
      const q = j["Global Quote"];
      if (q && q["05. price"]) state.quotes[p.symbol] = { price: +q["05. price"], prevClose: +q["08. previous close"] };
      await sleep(1300);
    }
    for (const p of CONFIG.positions) {
      if (state.history[p.symbol]) continue;
      const j = await avFetch({ function: "TIME_SERIES_MONTHLY_ADJUSTED", symbol: p.symbol, datatype: "json" });
      const ts = j["Monthly Adjusted Time Series"];
      if (ts) {
        const keys = Object.keys(ts).sort();
        state.history[p.symbol] = SNAPSHOT.months.map(mo => {
          const k = keys.filter(d => d.startsWith(mo)).pop() || keys.filter(d => d < mo + "-99").pop();
          return k ? +ts[k]["5. adjusted close"] : null;
        });
        if (state.history[p.symbol].some(v => v === null)) state.history[p.symbol] = null;
      }
      await sleep(1300);
    }
    state.live = true;
    state.lastUpdate = Date.now();
  } catch (e) {
    state.live = false;
  } finally {
    document.body.style.opacity = "1";
    renderAll();
  }
}

document.getElementById("refreshBtn").addEventListener("click", () => {
  if (!CONFIG.apiKey) {
    alert("Kein API-Key hinterlegt. Trage deinen kostenlosen Alpha-Vantage-Key in CONFIG.apiKey ein (siehe Kommentar im Quelltext), dann funktioniert die Live-Aktualisierung.");
    return;
  }
  refreshQuotes();
});

renderAll();
if (CONFIG.apiKey && navigator.onLine) {
  refreshQuotes();
  setInterval(refreshQuotes, Math.max(30, CONFIG.refreshSeconds) * 1000);
}
